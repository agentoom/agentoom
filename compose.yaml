# ==============================================================================
# Agentoom Community Edition - Default Compose File (Docker Compose v2)
# Usage: docker compose up -d
# ==============================================================================
services:
  agentoom:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/agentoom/community-core:latest
    container_name: agentoom-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:80"
      - "${REVERB_PORT:-8080}:8080"
    environment:
      APP_NAME: "${APP_NAME:-Agentoom Community}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"

      # Database Configuration (PostgreSQL 17)
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-agentoom}"
      DB_USERNAME: "${DB_USERNAME:-agentoom}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"

      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database

      # Realtime WebSockets (Laravel Reverb)
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${REVERB_APP_ID:-agentoom}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-agentoom-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-agentoom-secret}"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: "8080"
      REVERB_SCHEME: "http"

      # Initial Superadmin Configuration
      # (If left empty, a secure random 20-character password is generated on first startup and printed to container logs)
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@agentoom.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - agentoom-storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    container_name: agentoom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-agentoom}"
      POSTGRES_USER: "${DB_USERNAME:-agentoom}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-agentoom} -d ${DB_DATABASE:-agentoom}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agentoom-storage:
    name: agentoom-storage
  postgres-data:
    name: agentoom-postgres-data
